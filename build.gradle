plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'com.diffplug.eclipse.apt'
    id 'org.spongepowered.mixin'
    id 'com.modrinth.minotaur' version '2.+'
}

repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

group= "team.creative" + project.mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

project.evaluationDependsOn(":CreativeCore")

minecraft {
    mappings channel: 'official', version: "${project.property 'minecraft_version'}"
    
    runs {
        client {
            taskName "cmdcam_client"
            workingDirectory project.file('run')

            property 'forge.logging.console.level', 'debug'
            arg '--mixin.config'
            arg 'creativecore.mixins.json'
            arg '--mixin.config'
            arg 'creativecore.forge.mixins.json'

            mods {
                creativecore {
                    source project(':CreativeCore').sourceSets.main
                }
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            taskName "cmdcam_server"
            workingDirectory project.file('run')

            property 'forge.logging.console.level', 'debug'
            arg '--mixin.config'
            arg 'creativecore.mixins.json'
            arg '--mixin.config'
            arg 'creativecore.forge.mixins.json'

            mods {
                creativecore {
                    source project(':CreativeCore').sourceSets.main
                }
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.property 'minecraft_version'}-${project.property 'forge_version'}"
    
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    
    implementation project(':CreativeCore')
    
    minecraftLibrary fg.deobf("curse.maven:minema-resurrection-596719:4816846")
}

// modDependencies = [
//     [ modId: "creativecore", mandatory: true, ordering: "NONE", side: "BOTH", versionRange: creativecore_version ]
// ]

mixin {
    add sourceSets.main, 'cmdcam.mixin.refmap.json'
     
    config 'cmdcam.mixins.json'
}

tasks.named('jar', Jar).configure {
    archiveBaseName = project.mod_id
    archiveVersion = project.mod_version
    archiveClassifier = ''
}


